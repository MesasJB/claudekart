<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kart Web</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#101820;font-family:"Segoe UI",system-ui,sans-serif;color:#fff;user-select:none}
  canvas{display:block}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  #loading{background:#101820;z-index:10}
  #loadBarWrap{width:min(420px,80vw);height:14px;background:#26313d;border-radius:8px;overflow:hidden;margin-top:14px}
  #loadBar{height:100%;width:0;background:linear-gradient(90deg,#ff5a5a,#ffd84a);transition:width .2s}
  #menu{display:none;background:linear-gradient(rgba(8,14,22,.55),rgba(8,14,22,0) 30%,rgba(8,14,22,0) 55%,rgba(8,14,22,.75));z-index:5;justify-content:space-between;padding:14px 10px;box-sizing:border-box}
  #menu .top{display:flex;flex-direction:column;align-items:center}
  #logo{height:min(15vh,120px);max-width:80vw;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
  .sub{font-size:20px;margin-top:6px;text-shadow:0 2px 4px #000}
  .sub b{color:#ffd84a}
  #menu .bottom{display:flex;flex-direction:column;align-items:center;pointer-events:auto}
  #cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .card{width:104px;padding:8px 6px 6px;border-radius:14px;background:rgba(10,18,28,.75);border:3px solid rgba(255,255,255,.25);cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s}
  .card canvas{width:84px;height:84px;display:block;margin:0 auto;border-radius:10px;background:rgba(255,255,255,.08)}
  .card .cname{margin-top:5px;font-weight:700;font-size:15px}
  .card:hover{transform:translateY(-3px)}
  .card.sel{border-color:#ffd84a;transform:scale(1.1);box-shadow:0 0 18px rgba(255,216,74,.65)}
  #menu .keys{grid-template-columns:auto auto auto;font-size:14px;margin:12px 0 10px;padding:10px 16px}
  h1{font-size:clamp(34px,7vw,72px);margin:0 0 6px;letter-spacing:2px;text-shadow:0 4px 0 #b3261e,0 8px 18px rgba(0,0,0,.5)}
  .keys{display:grid;grid-template-columns:auto auto;gap:6px 18px;margin:18px 0;text-align:left;font-size:16px;background:rgba(0,0,0,.35);padding:14px 22px;border-radius:12px}
  .keys b{background:#fff;color:#111;border-radius:5px;padding:1px 8px;font-size:14px;margin-right:4px}
  .go{font-size:22px;padding:10px 26px;border-radius:12px;background:#ffd84a;color:#222;font-weight:700;animation:pulse 1s infinite alternate}
  @keyframes pulse{to{transform:scale(1.06)}}
  #menuWarn{color:#ffb4a8;margin-top:12px;font-size:14px;max-width:520px}
  #hud{display:none;position:fixed;inset:0;pointer-events:none;z-index:3}
  #lap{position:absolute;top:14px;left:18px;font-size:22px;font-weight:700;text-shadow:0 2px 4px #000}
  #place{position:absolute;top:6px;right:22px;font-size:76px;font-weight:900;font-style:italic;text-shadow:0 4px 0 #b3261e,0 0 14px rgba(0,0,0,.6)}
  #speed{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:26px;font-weight:700;text-shadow:0 2px 4px #000}
  #itemBox{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:76px;height:76px;border-radius:14px;background:rgba(0,0,0,.45);border:3px solid #fff;display:flex;align-items:center;justify-content:center}
  #item{font-size:46px}
  #itemBox{position:absolute}
  #itemIcon{position:absolute;inset:0;margin:auto}
  #big{position:absolute;top:30%;width:100%;text-align:center;font-size:120px;font-weight:900;text-shadow:0 6px 0 #b3261e,0 0 20px rgba(0,0,0,.6)}
  #msg{position:absolute;top:44%;width:100%;text-align:center;font-size:40px;font-weight:800;opacity:0;transition:opacity .25s;text-shadow:0 3px 6px #000}
  #mini{position:absolute;right:14px;bottom:14px;width:190px;height:190px;border-radius:12px}
  #results{display:none;background:rgba(8,14,22,.7);z-index:6}
  table{border-collapse:collapse;font-size:20px;min-width:340px;margin:12px 0 20px}
  td{padding:6px 14px;border-bottom:1px solid rgba(255,255,255,.18)} tr.me td{background:rgba(255,216,74,.25);font-weight:800}
  .hint{position:fixed;left:12px;bottom:10px;font-size:12px;opacity:.55;z-index:4}
</style>
</head>
<body>
<div id="loading" class="overlay"><h1>KART WEB</h1><div id="loadText">Iniciando…</div><div id="loadBarWrap"><div id="loadBar"></div></div></div>

<div id="menu" class="overlay">
  <div class="top">
    <img id="logo" alt="Mario Kart 8" style="display:none">
    <h1 id="logoText">KART WEB</h1>
    <div class="sub">Elegí tu personaje: <b id="selName"></b></div>
  </div>
  <div class="bottom">
    <div id="cards"></div>
    <div class="keys">
      <div><b>←</b><b>→</b> elegir personaje</div><div><b>Enter</b> correr</div>
      <div><b>W</b><b>↑</b> acelerar · <b>S</b><b>↓</b> frenar</div><div><b>A</b><b>D</b> / <b>←</b><b>→</b> girar</div>
      <div><b>Espacio</b> saltito + derrape</div><div><b>Shift</b> / <b>E</b> usar item · <b>M</b> silenciar</div>
    </div>
    <div class="go" id="goBtn">Presioná ENTER para correr</div>
    <div id="menuWarn"></div>
  </div>
</div>

<div id="hud">
  <div id="lap"></div><div id="place"></div>
  <div id="itemBox"><div id="item"></div><canvas id="itemIcon" width="72" height="72" style="display:none;width:72px;height:72px"></canvas></div>
  <div id="speed"></div><div id="big"></div><div id="msg"></div>
  <canvas id="mini" width="190" height="190"></canvas>
</div>

<div id="results" class="overlay">
  <h1 style="font-size:48px">Resultados</h1>
  <table id="resList"></table>
  <div class="go">ENTER para elegir personaje de nuevo</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
